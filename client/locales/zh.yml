guide.account: 保持 OneBot 或 Milky 机器人在线，LivingDiary 会使用它的空间。接了多个账号时，在「空间账号与命令」的 selfId 中填写要使用的机器人 QQ 号。把自己的 QQ 号加入 allowUserIds，就能使用空间命令。
guide.diary: 写下第一篇日记
guide.configureDiary: 启用 LivingMemory，并在「空间人设与模型」中选择空间预设和写日记的主模型。写作使用该预设在 LivingMemory 中的人设卡片，从当天新建且仍活跃的记忆中取材。没有卡片时使用预设的系统段原文。
guide.schedule: 定时写作默认开启，每天按服务器本地时间 23:50 开始，最多取最近 100 条记忆。关闭定时后仍可发送 qzone.digest 手动写作。如果没有当日素材，或模型决定跳过，就不会产生新日记。
guide.read: 每篇日记都保存在「日记」。默认也会发到 QQ 空间；只想记在日记册里，就在「每日日记」中关闭 publishDiaryToQzone。按预设和日期翻阅，左页是正文，右页是写作时的全部参考记忆。
guide.commands: 空间命令与对话工具
guide.receipt: 「未发布」表示日记已保存，还没有尝试发送。开启发布时，每篇只发一次。QQ 返回动态 ID 后会立即按 ID 读取动态，读到才标为「已发布」；其余发送结果记为「发布失败」。
guide.cmd.status: qzone.status
guide.use.status: 查看登录态、最近一次日记的结果和互动情况。
guide.cmd.feeds: qzone.feeds 3
guide.use.feeds: 读取机器人最近三条动态；分享动态会列出卡片标题、摘要和完整链接。
guide.cmd.publish: qzone.publish 今天下雨了
guide.use.publish: 发布正文、图片和 MP4 视频；同一条消息最多附 9 张图，也可以只发素材。图片每张最多 32 MiB，视频每段最多 128 MiB。
guide.cmd.digest: qzone.digest
guide.use.digest: 现在写一篇日记，按当前发布设置处理。
guide.feedTool: 白名单用户可以说「看看你自己的动态」「看看好友动态」或指定 QQ 号查看主页。好友动态按空间返回顺序展示；可以指定 1–10 条，或说「下一页」继续查看。关闭发布工具后仍可查看。
guide.tool: 开启 enablePublishTool 后，白名单用户可以在对话中发送图片和 MP4 视频，再说「把这些发到空间，自己配文字」，机器人会将正文与所选原文件一起发布为一条动态。
guide.interactions: 自动评论与回复
guide.interactionConfig: 在「空间人设与模型」中选择空间预设和互动模型，再在「自动互动」的 interactionAllowUserIds 中加入互动对象的 QQ 号。这份名单与命令白名单分开；默认开启名单限制，名单为空时不会与任何人互动。分享卡片的标题、摘要和链接会提供给模型，封面使用互动模型或 @vision 的看图能力，与配图共用每次互动九张、单张 15 MiB、合计 45 MiB 的限额。
guide.comments: 开启 enableFriendPostComment，机器人会考虑评论好友的新动态。interactionMonitorPostLimit 控制跟进多少条动态的评论区，设为 0 就停止跟进回复。上线时先记住现有内容，从下一次轮询起处理新增动态或评论。
